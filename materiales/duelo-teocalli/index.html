<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>100 estudiantes dijeron · Duelo Teocalli</title>
<style>
:root{
  /* colores del tema activo (los cambia applyTheme) */
  --ta:#ff2e88; --tb:#ffb000; --tc:#18d3c2; --bg1:#3a2aa8; --bg2:#5a1b8f; --c1:#5d3bd6; --c2:#2c1490; --cb:#8f74ff;
  --night:#140b3d;      /* cielo del estudio */
  --night2:#24125e;
  --violet:#3b1f8f;
  --pink:#ff2e88;       /* rosa mexicano */
  --marigold:#ffb000;   /* cempasúchil */
  --gold:#ffd84a;
  --teal:#18d3c2;
  --lime:#9be22d;
  --txt:#fff8ee;
  --muted:#d4c8ff;
  --blue:#2f7bf6; --blue-d:#163f9e;
  --orange:#ff7a1a; --orange-d:#b54800;
  --red:#ff2a3d; --ok:#3df08b;
  --miss:#6b5aa8;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;color:var(--txt);overflow:hidden;
  font-family:"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:var(--night)}
button{font:inherit;cursor:pointer;border:none}
input,textarea{font:inherit}
.hidden{display:none!important}
.display{font-family:"Arial Black","Segoe UI Black","Helvetica Neue",Arial,sans-serif;font-weight:900}
.num{font-family:Impact,"Haettenschweiler","Arial Narrow Bold","Arial Black",sans-serif;font-weight:400;letter-spacing:.02em}
:focus-visible{outline:4px solid var(--gold);outline-offset:3px}

/* ================= ESCENARIO (fondo animado) ================= */
#stage{position:fixed;inset:0;z-index:0;overflow:hidden;
  background:radial-gradient(ellipse 120% 70% at 50% 110%,var(--bg2) 0%,transparent 60%),
             radial-gradient(ellipse 80% 60% at 50% -20%,var(--bg1) 0%,transparent 65%),var(--night);transition:background .6s}
#motifs span{position:absolute;bottom:-12vh;opacity:.16;filter:saturate(.8);animation:drift linear infinite}
@keyframes drift{from{transform:translateY(0) rotate(-10deg)}to{transform:translateY(-130vh) rotate(14deg)}}
.beam{position:absolute;bottom:-20vh;width:40vw;height:150vh;transform-origin:50% 100%;
  background:conic-gradient(from 180deg at 50% 100%,transparent 0deg,rgba(255,216,74,.14) 8deg,rgba(255,255,255,.05) 14deg,transparent 22deg);
  filter:blur(6px);mix-blend-mode:screen}
.beam.l{left:-6vw;animation:sweepL 9s ease-in-out infinite alternate}
.beam.r{right:-6vw;animation:sweepR 11s ease-in-out infinite alternate;
  background:conic-gradient(from 180deg at 50% 100%,transparent 0deg,rgba(24,211,194,.13) 8deg,rgba(255,255,255,.05) 14deg,transparent 22deg)}
@keyframes sweepL{from{transform:rotate(-28deg)}to{transform:rotate(22deg)}}
@keyframes sweepR{from{transform:rotate(26deg)}to{transform:rotate(-24deg)}}
.sparks{position:absolute;inset:0;opacity:.55;
  background-image:radial-gradient(2px 2px at 12% 30%,#fff,transparent),radial-gradient(2px 2px at 78% 18%,#ffd84a,transparent),
   radial-gradient(1.5px 1.5px at 40% 70%,#fff,transparent),radial-gradient(2px 2px at 88% 64%,#18d3c2,transparent),
   radial-gradient(1.5px 1.5px at 24% 86%,#ff2e88,transparent),radial-gradient(2px 2px at 60% 40%,#fff,transparent);
  animation:twinkle 3.4s ease-in-out infinite alternate}
@keyframes twinkle{from{opacity:.25}to{opacity:.7}}
body.siren #stage::after{content:"";position:absolute;inset:0;animation:siren .7s linear infinite;
  background:linear-gradient(90deg,var(--sirenA) 0%,transparent 35%,transparent 65%,var(--sirenB) 100%)}
@keyframes siren{0%,100%{opacity:.15}50%{opacity:.55}}

/* ================= PAPEL PICADO ================= */
.picado{position:fixed;top:0;left:0;right:0;height:5.2vh;display:flex;justify-content:space-around;z-index:1;pointer-events:none}
.picado::before{content:"";position:absolute;top:.5vh;left:0;right:0;height:2px;background:#fff6}
.flag{width:6.4vw;height:5vh;transform-origin:50% 0;animation:sway 3s ease-in-out infinite alternate;
  clip-path:polygon(0 0,100% 0,100% 78%,90% 100%,80% 78%,70% 100%,60% 78%,50% 100%,40% 78%,30% 100%,20% 78%,10% 100%,0 78%);
  -webkit-mask:radial-gradient(circle at 25% 38%,transparent 9%,#000 10%) ,radial-gradient(circle at 75% 38%,transparent 9%,#000 10%);
  -webkit-mask-composite:source-in;mask-composite:intersect;opacity:.92}
.flag:nth-child(5n+1){background:var(--ta)} .flag:nth-child(5n+2){background:var(--tb)}
.flag:nth-child(5n+3){background:var(--tc)} .flag:nth-child(5n+4){background:var(--gold)} .flag:nth-child(5n){background:var(--cb)}
.flag:nth-child(odd){animation-duration:2.4s;animation-delay:-.8s}
@keyframes sway{from{transform:rotate(-5deg)}to{transform:rotate(5deg)}}

/* ================= ESTRUCTURA ================= */
#app{position:relative;z-index:2;height:100vh;display:flex;flex-direction:column;padding:5.4vh 1.6vw 1.4vh;gap:1.1vh}
#app.shake{animation:shake .5s cubic-bezier(.36,.07,.19,.97)}
@keyframes shake{10%,90%{transform:translateX(-4px)}20%,80%{transform:translateX(8px)}30%,50%,70%{transform:translateX(-14px)}40%,60%{transform:translateX(14px)}}

.top{display:flex;align-items:center;gap:1vw}
.brand{display:flex;align-items:baseline;gap:.8vw;white-space:nowrap;min-width:0;overflow:hidden}
.brand .logo{font-size:clamp(16px,1.7vw,36px);color:var(--gold);text-shadow:0 0 18px #ffb00088,0 3px 0 #6a2b00}
.brand .rd{font-weight:800;color:var(--teal);font-size:clamp(12px,1vw,20px)}
.tools{margin-left:auto;display:flex;gap:.5vw}
.tool{background:#ffffff14;color:var(--txt);border:2px solid #ffffff30;border-radius:999px;padding:.5vh .9vw;
  font-weight:700;font-size:clamp(12px,.9vw,18px);white-space:nowrap;backdrop-filter:blur(4px)}
.tool:hover{border-color:var(--gold);color:var(--gold)}
.tool:disabled{opacity:.7;cursor:not-allowed;filter:grayscale(1);border-style:dashed}

/* ================= MARCADOR ================= */
.scores{display:grid;grid-template-columns:1fr auto 1fr;gap:1.2vw;align-items:stretch}
.team{position:relative;border-radius:18px;padding:.8vh 1.2vw;display:flex;align-items:center;justify-content:space-between;gap:1vw;
  border:4px solid #ffffff40;overflow:hidden;transition:transform .3s}
.team.t0{background:linear-gradient(135deg,#4f95ff,var(--blue) 45%,var(--blue-d))}
.team.t1{background:linear-gradient(135deg,#ffa04d,var(--orange) 45%,var(--orange-d))}
.team::after{content:"";position:absolute;top:0;bottom:0;width:30%;left:-40%;
  background:linear-gradient(100deg,transparent,#ffffff55,transparent);transform:skewX(-20deg)}
.team.on{border-color:var(--gold);transform:scale(1.025);box-shadow:0 0 0 3px #00000040,0 0 34px #ffd84aaa}
.team.on::after{animation:shine 2.2s ease-in-out infinite}
@keyframes shine{from{left:-40%}to{left:130%}}
.team .nm{font-size:clamp(16px,2.1vw,42px);line-height:1.05;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-shadow:0 3px 0 #0005}
.team .tag{display:block;font-weight:800;font-size:clamp(10px,.85vw,17px);opacity:.95}
.team .pts{font-size:clamp(34px,4.2vw,84px);line-height:1;background:#0006;border-radius:14px;padding:.2vh 1vw;min-width:5vw;text-align:center;text-shadow:0 0 12px #fff8}
.bank{position:relative;background:radial-gradient(circle at 50% 30%,#3b1f8f,#12062e);border:4px solid var(--gold);border-radius:20px;
  padding:.3vh 1.8vw;text-align:center;min-width:12vw;box-shadow:0 0 30px #ffb00066,inset 0 0 20px #000}
.bank small{display:block;font-weight:800;color:var(--gold);font-size:clamp(11px,1vw,20px)}
.bank b{font-size:clamp(36px,4.4vw,88px);line-height:1;color:#fff;text-shadow:0 0 16px #ffd84a}
.bank.bump{animation:bump .5s cubic-bezier(.3,1.8,.5,1)}
@keyframes bump{40%{transform:scale(1.18)}}

/* ================= PREGUNTA ================= */
.q{position:relative;background:linear-gradient(180deg,#ffffff,#ffe9b8);color:#2a0f5c;border-radius:20px;
  padding:1vh 1.8vw;text-align:center;font-size:clamp(20px,2.7vw,56px);line-height:1.12;
  box-shadow:0 6px 0 #a35a00,0 12px 30px #0008}
.q.enter{animation:qin .7s cubic-bezier(.2,1.4,.4,1) both}
.q .rn{display:block;font-family:"Segoe UI",Arial;font-weight:800;font-size:clamp(11px,1vw,20px);color:var(--ta)}
@keyframes qin{from{transform:translateY(-30px) scale(.94);opacity:0}}

/* ================= TABLERO ================= */
.main{flex:1;min-height:0;display:grid;grid-template-columns:1.35fr 1fr;gap:1.4vw}
.boardWrap{position:relative;border-radius:24px;padding:12px;min-height:0;
  background:linear-gradient(135deg,var(--tb),var(--ta) 50%,var(--tc));box-shadow:0 0 40px color-mix(in srgb,var(--ta) 45%,transparent)}
/* foquitos de marquesina que corren */
.boardWrap::before,.boardWrap::after{content:"";position:absolute;inset:3px;border-radius:21px;pointer-events:none;
  background:radial-gradient(circle,#fffbe0 0 3px,#ffd84a 4px,transparent 6px) 0 0/22px 22px;
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;padding:4px;
  animation:bulbs 1s steps(2) infinite}
.boardWrap::after{background-position:11px 11px;animation-delay:-.5s}
@keyframes bulbs{0%{opacity:1}50%{opacity:.15}100%{opacity:1}}
.board{height:100%;display:grid;grid-template-rows:repeat(5,1fr);gap:.9vh;
  background:radial-gradient(circle at 50% 0%,#2b1670,#0d0526);border-radius:16px;padding:1.1vh .9vw}
.cell{perspective:1000px;min-height:0}
.enter .cell{animation:cellin .5s cubic-bezier(.2,1.3,.4,1) both}
.enter .cell:nth-child(2){animation-delay:.07s}.enter .cell:nth-child(3){animation-delay:.14s}.enter .cell:nth-child(4){animation-delay:.21s}.enter .cell:nth-child(5){animation-delay:.28s}
@keyframes cellin{from{transform:translateX(-40px);opacity:0}}
.cell .in{position:relative;width:100%;height:100%;transition:transform .75s cubic-bezier(.3,1.5,.45,1);transform-style:preserve-3d}
.cell.open .in{transform:rotateX(-180deg)}
.face{position:absolute;inset:0;border-radius:12px;display:flex;align-items:center;backface-visibility:hidden;-webkit-backface-visibility:hidden;padding:0 1.2vw}
.front{background:linear-gradient(180deg,var(--c1),var(--c2));border:3px solid var(--cb);justify-content:center;box-shadow:inset 0 -6px 0 #0004}
.front .n{width:clamp(36px,3.8vw,74px);height:clamp(36px,3.8vw,74px);border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#4a2aa8,#12062e);border:3px solid var(--gold);
  display:flex;align-items:center;justify-content:center;font-size:clamp(22px,2.6vw,52px);color:var(--gold);text-shadow:0 0 10px #ffb000}
.cell.can .front{cursor:pointer;border-color:var(--teal);animation:ask 1.2s ease-in-out infinite}
.cell.can .front::after{content:"Revelar";position:absolute;right:1.2vw;font-weight:800;font-size:clamp(11px,.95vw,19px);color:var(--teal)}
@keyframes ask{50%{box-shadow:0 0 0 4px #18d3c255,0 0 24px #18d3c2aa}}
.back{transform:rotateX(180deg);background:linear-gradient(180deg,#fff7cf,var(--gold) 55%,var(--marigold));color:#2a0f00;border:3px solid #fff;justify-content:space-between;gap:1vw;box-shadow:inset 0 -6px 0 #0002}
.back .a{font-size:clamp(18px,2.3vw,48px);line-height:1.05;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.back .p{font-size:clamp(24px,3vw,62px);background:#2a0f5c;color:var(--gold);border-radius:10px;padding:0 .9vw;min-width:5vw;text-align:center}
.back .who{font-family:"Segoe UI",Arial;font-weight:800;font-size:clamp(10px,.8vw,16px);display:block;opacity:.85}
.cell.stolen .back{background:linear-gradient(180deg,#d4fff9,var(--teal));}
.cell.miss .back{background:linear-gradient(180deg,#a99be0,var(--miss));color:#fff;border-color:#d7ceff}
.cell.miss .back .p{background:#2c2160;color:#d9d6ff;text-decoration:line-through}
.cell.flash .back::after{content:"";position:absolute;inset:-3px;border-radius:12px;animation:flash .9s ease-out forwards;
  background:radial-gradient(circle,#fff 0%,transparent 70%)}
@keyframes flash{from{opacity:1}to{opacity:0}}

.fly{position:fixed;z-index:30;pointer-events:none;font-size:clamp(30px,3.6vw,72px);color:var(--gold);
  text-shadow:0 0 14px #ffb000,0 4px 0 #6a2b00;animation:fly 1.1s cubic-bezier(.3,.7,.4,1) forwards}
@keyframes fly{0%{transform:translate(0,0) scale(.6);opacity:0}20%{transform:translate(0,-30px) scale(1.25);opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(.5);opacity:0}}

/* ================= PANEL LATERAL ================= */
.side{display:flex;flex-direction:column;gap:1vh;min-height:0}
.box{background:linear-gradient(180deg,#2b1670ee,#1a0b47ee);border:3px solid #6e4fe0;border-radius:18px;padding:1.2vh 1vw;box-shadow:0 8px 24px #0006}
.ttl{font-size:clamp(20px,2.1vw,42px);text-align:center;margin:0 0 1vh;color:var(--gold);text-shadow:0 3px 0 #6a2b00}

.buzz{display:flex;flex-direction:column;gap:1.6vh;flex:1;justify-content:center}
.big{position:relative;border-radius:18px;color:#fff;font-size:clamp(22px,2.6vw,54px);padding:2.2vh 1vw;border:4px solid #ffffff60;
  box-shadow:0 8px 0 #0008,0 0 24px #0006;transition:transform .12s;overflow:hidden}
.big:hover{transform:translateY(-3px) scale(1.02)}
.big:active{transform:translateY(4px);box-shadow:0 3px 0 #0008}
.big.t0{background:linear-gradient(135deg,#4f95ff,var(--blue-d))}
.big.t1{background:linear-gradient(135deg,#ffa04d,var(--orange-d))}
.big .ham{display:inline-block;transform-origin:70% 90%;animation:wave 1.1s ease-in-out infinite}
.big.t1 .ham{animation-delay:-.55s}
@keyframes wave{0%,50%,100%{transform:rotate(0)}15%{transform:rotate(-18deg)}30%{transform:rotate(16deg)}}
.hint{color:var(--muted);text-align:center;font-weight:700;font-size:clamp(12px,1vw,20px);margin:0}

.chars{display:grid;gap:.7vh}
.ch{border-radius:14px;padding:.7vh .9vw;background:#1a0b47;border:3px solid #3b2a80;opacity:.75;display:flex;align-items:center;gap:.8vw;transition:all .35s}
.ch .k{font-size:clamp(11px,.9vw,18px);font-weight:900;color:var(--muted);white-space:nowrap}
.ch .nm{font-size:clamp(16px,1.8vw,36px);line-height:1.05;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ch .d{font-size:clamp(10px,.8vw,16px);color:var(--muted);font-weight:700;white-space:nowrap}
.ch.on{opacity:1;background:#fff;color:#2a0f5c;transform:scale(1.03);animation:mic 1.6s ease-in-out infinite}
.ch.on .k,.ch.on .d{color:var(--pink)}
.ch.on .nm::before{content:"🎤 "}
.side.c0 .ch.on{border-color:var(--blue)} .side.c1 .ch.on{border-color:var(--orange)}
@keyframes mic{50%{box-shadow:0 0 0 5px #ffd84a66,0 0 26px #ffd84aaa}}

.strikes{display:flex;gap:.9vw;justify-content:center}
.sx{width:clamp(50px,5.4vw,108px);height:clamp(50px,5.4vw,108px);border-radius:14px;border:4px dashed #ffffff55;background:#0007;
  display:flex;align-items:center;justify-content:center;font-size:clamp(40px,4.6vw,94px);color:var(--red);line-height:1;font-weight:900}
.sx.on{border:4px solid var(--red);background:radial-gradient(circle,#5a0010,#200006);text-shadow:0 0 16px #f00}
.sx.new{animation:slam .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes slam{from{transform:scale(2.6) rotate(-20deg);opacity:0}}

.entry label{display:block;font-weight:800;color:var(--muted);font-size:clamp(11px,.95vw,19px);margin-bottom:.4vh}
.row{display:flex;gap:.6vw}
.entry input{flex:1;min-width:0;padding:1vh .8vw;border-radius:12px;border:3px solid #6e4fe0;background:#fff;color:#2a0f5c;
  font-size:clamp(16px,1.7vw,34px);font-weight:800}
.entry input:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 4px #ffd84a55}
.btn{border-radius:12px;padding:1vh 1.1vw;font-weight:900;font-size:clamp(13px,1.15vw,23px);color:#2a0f5c;
  background:linear-gradient(180deg,#ffe98a,var(--marigold));box-shadow:0 4px 0 #a35a00;transition:transform .1s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #a35a00}
.btn.red{background:linear-gradient(180deg,#ff6b78,var(--red));color:#fff;box-shadow:0 4px 0 #8a0010}
.btn.teal{background:linear-gradient(180deg,#8ff5ea,var(--teal));box-shadow:0 4px 0 #0a7a70}
.btn.ghost{background:transparent;color:var(--txt);border:2px solid var(--muted);box-shadow:none}
.btn.wide{width:100%}
.msg{min-height:1.4em;font-weight:900;font-size:clamp(14px,1.45vw,29px);text-align:center;margin:.6vh 0 0}
.msg.ok{color:var(--ok);animation:pop .4s cubic-bezier(.2,1.6,.4,1)} .msg.warn{color:var(--gold);animation:pop .4s} .msg.bad{color:#ff9aa4;animation:pop .4s}
@keyframes pop{from{transform:scale(.6);opacity:0}}
.msgbtns{display:flex;gap:.6vw;justify-content:center;margin-top:.7vh;flex-wrap:wrap}

.steal{border-radius:18px;padding:1.3vh 1vw;text-align:center;font-size:clamp(20px,2.4vw,50px);line-height:1.1;
  border:4px solid #fff;animation:alarm .6s ease-in-out infinite alternate;text-shadow:0 3px 0 #0006}
.steal.t0{background:linear-gradient(135deg,#4f95ff,var(--blue-d))} .steal.t1{background:linear-gradient(135deg,#ffa04d,var(--orange-d))}
.steal small{display:block;font-family:"Segoe UI",Arial;font-weight:800;font-size:.42em;margin-top:.5vh}
@keyframes alarm{from{box-shadow:0 0 0 #ff2a3d00;transform:scale(1)}to{box-shadow:0 0 40px #ff2a3dcc;transform:scale(1.02)}}

.result{text-align:center;animation:qin .6s cubic-bezier(.2,1.4,.4,1) both}
.result .w{font-size:clamp(22px,2.6vw,54px);line-height:1.1}
.result .w.t0{color:#9cc4ff} .result .w.t1{color:#ffc08a}
.result .plus{font-size:clamp(48px,6vw,120px);color:var(--gold);line-height:1;text-shadow:0 0 24px #ffb000,0 5px 0 #6a2b00}
.result .how{font-weight:800;color:var(--muted);font-size:clamp(13px,1.2vw,24px);margin:.4vh 0}
.legend{display:flex;gap:1vw;justify-content:center;font-weight:700;font-size:clamp(11px,.9vw,18px);color:var(--muted);margin-top:.4vh;flex-wrap:wrap}
.legend i{display:inline-block;width:1em;height:1em;border-radius:3px;vertical-align:-.15em;margin-right:.3em}

/* ================= REGISTRO ================= */
.setup{flex:1;min-height:0;display:flex;flex-direction:column;gap:1.4vh;overflow:auto;padding:0 .2vw}
.hero{text-align:center;animation:qin .8s cubic-bezier(.2,1.4,.4,1) both}
.hero h1{margin:0;font-size:clamp(30px,4.6vw,92px);line-height:1;color:var(--gold);
  text-shadow:0 0 30px #ffb00088,0 5px 0 #a3007a,0 10px 0 #4a0a6b}
.hero h1 span{display:inline-block;animation:bounce 2.4s ease-in-out infinite}
@keyframes bounce{0%,80%,100%{transform:translateY(0)}88%{transform:translateY(-12px)}}
.hero p{margin:.6vh 0 0;color:var(--teal);font-weight:800;font-size:clamp(14px,1.4vw,28px)}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:2vw}
.tcard{border-radius:20px;padding:1.6vh 1.4vw;border:4px solid #ffffff55;box-shadow:0 10px 30px #0007;animation:qin .7s cubic-bezier(.2,1.4,.4,1) both}
.tcard.t1{animation-delay:.12s}
.tcard.t0{background:linear-gradient(160deg,#4f95ff,var(--blue-d))}
.tcard.t1{background:linear-gradient(160deg,#ffa04d,var(--orange-d))}
.tcard label{display:block;font-weight:900;margin:.6vh 0 .3vh;font-size:clamp(13px,1.05vw,21px)}
.tcard input,.tcard textarea{width:100%;border-radius:12px;border:3px solid transparent;padding:.8vh .8vw;font-weight:700;color:#2a0f5c;font-size:clamp(14px,1.2vw,24px)}
.tcard textarea{height:28vh;resize:vertical;line-height:1.35}
.tcard .err{color:#fff;background:#b00020;border-radius:8px;padding:.3vh .6vw;margin-top:.6vh;font-weight:800;font-size:clamp(12px,.95vw,19px);animation:pop .3s}
.tcard .cnt{font-weight:800;opacity:.95;font-size:clamp(11px,.9vw,18px);margin-top:.4vh}
.tcard h2{margin:0;font-size:clamp(22px,2.4vw,48px);text-shadow:0 3px 0 #0005}
.tcard ol{margin:.8vh 0 0;padding-left:2.2em;columns:2;font-weight:800;font-size:clamp(14px,1.3vw,26px)}
.actions{display:flex;gap:1vw;justify-content:center}
.actions .btn{font-size:clamp(16px,1.5vw,30px);padding:1.4vh 2vw}

#count{position:fixed;inset:0;z-index:45;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle,#3b1f8fee 0%,#0d0526f5 70%)}

@keyframes ring{from{transform:scale(.6);opacity:1}to{transform:scale(1.25);opacity:0}}
#count b{position:relative;font-size:min(48vh,38vw);line-height:1;color:var(--gold);text-shadow:0 0 50px #ffb000,0 1.2vh 0 #a3007a,0 2.4vh 0 #4a0a6b;

#confetti{position:fixed;inset:0;z-index:35;pointer-events:none}

#bigX span{font-size:min(38vh,30vw);color:var(--red);font-weight:900;text-shadow:0 0 50px #f00,0 0 6px #000;animation:xpop .95s ease-out forwards}

.modal-bg{position:fixed;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;z-index:50}

/* ===================================================================
   COMPARACIÓN DE RESPUESTAS
   =================================================================== */
/* La ñ se cambia por «ny» antes de quitar acentos: así «uñas» (unyas) no se confunde con el artículo «unas» */
const STOP = new Set(["un","una","unos","unas","el","la","los","las","lo","de","del","al","a","y","e","o","u","en","con","que","se","me","le","les","mi","mis","su","sus","tu","tus","pues","este","esta","eh","por","para","yo"]);
function toks(s){
  return String(s).toLowerCase().replace(/ñ/g,"ny").normalize("NFD").replace(/[̀-ͯ]/g,"")
    .replace(/[^a-z0-9 ]/g," ").split(/\s+/).filter(w=>w && !STOP.has(w));
}
function wEq(a,b){
  if(a===b) return true;
  const pl=(x,y)=> y===x+"s" || y===x+"es" || y===x.replace(/z$/,"c")+"es";
  return pl(a,b)||pl(b,a);
}
function hasSeq(inp,v){
  for(let i=0;i+v.length<=inp.length;i++){
    let ok=true; for(let j=0;j<v.length;j++){ if(!wEq(inp[i+j],v[j])){ ok=false; break; } }
    if(ok) return true;
  }
  return false;
}
function variants(ans){ return [ans[0], ...String(ans[2]||"").split(",")].map(toks).filter(t=>t.length); }
/* Devuelve el índice de la respuesta (0-4) o -1 si no coincide. Gana la coincidencia más larga. */
function matchAnswer(text, q){
  const inp = toks(text); if(!inp.length) return -1;
  let best=-1, len=0;
  q.r.forEach((a,i)=> variants(a).forEach(v=>{ if(v.length>len && hasSeq(inp,v)){ best=i; len=v.length; } }));
  return best;
}

let AC=null;
function play(notes){
  if(!G.sound) return;
  try{
    AC = AC || new (window.AudioContext||window.webkitAudioContext)();
    const t0=AC.currentTime+.02;
    notes.forEach(([f,d,type,at,vol,to])=>{
      const o=AC.createOscillator(), g=AC.createGain();
      o.type=type||"sine"; o.frequency.setValueAtTime(f,t0+at);
      if(to) o.frequency.exponentialRampToValueAtTime(to,t0+at+d);
      g.gain.setValueAtTime(0.0001,t0+at); g.gain.exponentialRampToValueAtTime(vol||.25,t0+at+.02);
      g.gain.exponentialRampToValueAtTime(0.0001,t0+at+d);
      o.connect(g).connect(AC.destination); o.start(t0+at); o.stop(t0+at+d+.05);
    });
  }catch(e){}
}

   =================================================================== */
let CF={parts:[],raf:0,until:0};
function confetti(colors, n=160, loop=false){
  if(REDUCED) return;
  const c=$("confetti"), x=c.getContext("2d");
  c.width=innerWidth; c.height=innerHeight;
  const add=k=>{ for(let i=0;i<k;i++) CF.parts.push({x:Math.random()*c.width, y:-20-Math.random()*c.height*.4, vx:(Math.random()-.5)*6, vy:2+Math.random()*5,
    r:Math.random()*Math.PI, vr:(Math.random()-.5)*.3, w:8+Math.random()*10, h:6+Math.random()*8, col:colors[i%colors.length]}); };
  add(n); CF.until = loop ? Infinity : performance.now()+4500;
  cancelAnimationFrame(CF.raf);
  const step=t=>{
    x.clearRect(0,0,c.width,c.height);
    if(loop && Math.random()<.35) add(3);
    CF.parts=CF.parts.filter(p=>p.y<c.height+30);
    CF.parts.forEach(p=>{ p.x+=p.vx; p.y+=p.vy; p.vy+=.06; p.vx*=.995; p.r+=p.vr;
      x.save(); x.translate(p.x,p.y); x.rotate(p.r); x.fillStyle=p.col; x.fillRect(-p.w/2,-p.h/2,p.w,p.h*Math.abs(Math.cos(p.r*2))+2); x.restore(); });
    if(CF.parts.length && t<CF.until) CF.raf=requestAnimationFrame(step); else { x.clearRect(0,0,c.width,c.height); CF.parts=[]; }
  };
  CF.raf=requestAnimationFrame(step);
}
/* Efectos programados (fanfarria, confeti, sirena): se cancelan al deshacer o empezar de nuevo */
let TIMERS=[];
function later(fn,ms){ TIMERS.push(setTimeout(fn,ms)); }
function stopConfetti(){ TIMERS.forEach(clearTimeout); TIMERS=[]; ui.counting=false; const cd=$("count"); if(cd) cd.remove(); cancelAnimationFrame(CF.raf); CF.parts=[]; const c=$("confetti"); c.getContext("2d").clearRect(0,0,c.width,c.height); }
const TEAMCOL=[["#2f7bf6","#9cc4ff","#ffffff","#ffd84a"],["#ff7a1a","#ffc08a","#ffffff","#ffd84a"]];
function setSiren(){
  const b=document.body;
  if(G.phase==="steal" && G.round){ const rv=1-G.round.control; b.classList.add("siren");
    b.style.setProperty("--sirenA", rv?"#ff7a1a99":"#2f7bf699"); b.style.setProperty("--sirenB","#ff2a3d99"); }
  else b.classList.remove("siren");
}
function countUp(el, from, to){
  if(from===to || REDUCED){ el.textContent=to; return; }
  const t0=performance.now(), d=900;
  const f=t=>{ const k=Math.min(1,(t-t0)/d), e=1-Math.pow(1-k,3); el.textContent=Math.round(from+(to-from)*e); if(k<1) requestAnimationFrame(f); };
  el.textContent=from; requestAnimationFrame(f);
}
function afterRender(){
  // contadores animados
  const now={s0:G.teams[0]?G.teams[0].score:0, s1:G.teams[1]?G.teams[1].score:0, bank:G.round?G.round.bank:0};
  const prev=ui.shown||now;
  [["pts0","s0"],["pts1","s1"],["bankN","bank"]].forEach(([id,k])=>{ const el=$(id); if(el) countUp(el, prev[k], now[k]); });
  if(prev.bank!==now.bank && $("bankBox")){ $("bankBox").classList.add("bump"); }
  ui.shown=now;
  // casillas que giran
  if(ui.flip.length){
    const list=ui.flip.slice(); ui.flip=[];
    requestAnimationFrame(()=>requestAnimationFrame(()=>list.forEach(i=>{
      const c=document.querySelector(`.cell[data-i="${i}"]`); if(c){ c.classList.add("open","flash"); }
    })));
  }
  // puntos que vuelan a la bolsa
  if(ui.fly){
    const {i,pts}=ui.fly; ui.fly=null;
    const c=document.querySelector(`.cell[data-i="${i}"]`), bank=$("bankBox");
    if(c && bank && !REDUCED){
      const a=c.getBoundingClientRect(), b=bank.getBoundingClientRect();
      const el=document.createElement("div"); el.className="fly num"; el.textContent="+"+pts;
      el.style.left=(a.left+a.width*.7)+"px"; el.style.top=(a.top)+"px";
      el.style.setProperty("--dx",(b.left+b.width/2-(a.left+a.width*.7))+"px"); el.style.setProperty("--dy",(b.top+b.height/2-a.top)+"px");
      document.body.appendChild(el); setTimeout(()=>el.remove(),1200);
    }
  }
  setSiren();
}

const Q = qi=>QMAP[qi] || FALTA;
const other = t=>1-t;
function shuffle(a){ const b=a.slice(); for(let i=b.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [b[i],b[j]]=[b[j],b[i]]; } return b; }
function pickUnused(){
  const all=keysFor(G.tema||"mezcla");
  let pool=all.filter(k=>!G.used.includes(k));
  if(!pool.length){
    G.used=G.used.filter(k=>!all.includes(k));
    const fresh=all.filter(k=>!G.qOrder.includes(k) && !(G.tie && G.tie.qi===k));
    pool=fresh.length?fresh:all;
  }
  const q=pool[Math.floor(Math.random()*pool.length)]; G.used.push(q); return q;
}
/* Siguientes tres integrantes del equipo, en orden de registro y de forma circular */
function nextThree(t){
  const tm=G.teams[t], n=tm.members.length, out=[];
  for(let k=0;k<3;k++) out.push((tm.rot+k)%n);
  tm.rot=(tm.rot+3)%n;
  return out;
}
/* Menú principal: pausa la partida y lleva a la pantalla de equipos */
function goMenu(){
  stopConfetti(); ui.msg=null; ui.pending="";
  G.resume=G.phase;
  G.draft=G.teams.map(t=>({name:t.name, list:t.members.join("\n")}));
  G.phase="review";
  save(); render();
}
/* Continuar: aplica los cambios de nombres e integrantes sin tocar los puntos */
/* Aplica nombres e integrantes corregidos a un estado (el actual o una copia de «Deshacer») */
function applyRoster(st, drafts){
  drafts.forEach((d,i)=>{
    const tm=st.teams[i], m=parseList(d.list), changed=m.length!==tm.members.length;
    tm.name=d.name.trim()||(i?"Equipo Naranja":"Equipo Azul");
    tm.members=m; tm.rot=tm.rot%m.length;
    if(changed && st.round && st.round.control===i && st.round.chars.length){
      const start=st.round.chars[0]%m.length;
      st.round.chars=[0,1,2].map(k=>(start+k)%m.length);
    }
  });
}
function resumeGame(){
  ui.msg=null; ui.pending="";
  const drafts=G.draft;
  applyRoster(G, drafts);
  // así «Deshacer» después de continuar no regresa los nombres viejos
  UNDO.forEach(st=>{ if(st.teams && st.teams.length===2){ applyRoster(st, drafts); st.draft=clone(drafts); } });
  G.phase=G.resume; G.resume=null;
  save(); render();
}
function startGame(tema){
  G.tema = tema || G.tema || "mezcla";
  G.teams = G.draft.map((d,i)=>({name:d.name.trim()||(i?"Equipo Naranja":"Equipo Azul"), members:parseList(d.list), score:0, rot:0}));
  G.used=[]; G.qOrder=[]; for(let i=0;i<RONDAS;i++) G.qOrder.push(pickUnused());
  G.roundIdx=0; G.tie=null; G.winner=null; G.resume=null; ui.shown=null;
  startRound();
}
function startRound(){
  G.round={qi:G.qOrder[G.roundIdx], control:null, chars:[], turn:0,
    cells:[0,0,0,0,0],   // 0 oculta · 1 la abrió el equipo con control · 2 la abrió el robo · 3 nadie la dijo (revelada al final)
    strikes:0, bank:0, winner:null, how:null, gained:0, ready:false};
  G.phase="buzz";
}
function pickBuzz(t){
  const r=G.round; r.control=t; r.chars=nextThree(t); r.turn=0; G.phase="play"; SFX.buzz();
}
function addStrike(){
  const r=G.round; r.strikes++; r.turn=(r.turn+1)%3; ui.newX=r.strikes;
  bigX(r.strikes); SFX.bad();
  if(r.strikes>=3){ G.phase="steal"; later(SFX.steal,700); }
}
function revealPlay(i){
  const r=G.round, q=Q(r.qi);
  r.cells[i]=1; r.bank+=q.r[i][1]; r.turn=(r.turn+1)%3; SFX.ok();
  ui.flip=[i]; ui.fly={i,pts:q.r[i][1]};
  if(r.cells.every(c=>c)) endRound(r.control,"board");
}
/* Al cerrar la ronda, las casillas que nadie dijo quedan ocultas; el conductor las revela cuando quiera. */
function endRound(w, how){
  const r=G.round;
  r.winner=w; r.how=how; r.gained=r.bank;
  G.teams[w].score+=r.bank;
  G.phase="roundEnd";
  later(()=>{ SFX.win(); confetti(TEAMCOL[w]); },500);
}
function revealMissing(cells, i){
  if(cells[i]) return;
  cells[i]=3; ui.flip.push(i); SFX.reveal();
}
/* Cuenta regresiva 3, 2, 1 antes de mostrar la pregunta: nadie puede ver la pregunta antes de tiempo */
function countdown(){
  if(ui.counting) return; ui.counting=true;
  const el=document.createElement("div"); el.id="count"; el.setAttribute("role","status");
  document.body.appendChild(el);
  const steps=["3","2","1","¡YA!"];
  steps.forEach((n,k)=>later(()=>{
    el.innerHTML=`<div class="ring"></div><b class="num ${k===3?"go":""}">${n}</b><small>${k<3?"Prepárense… manos abajo":"¡Manos arriba! Gana quien levante la mano primero"}</small>`;
    if(k<3) play([[k===2?660:520,.18,"square",0,.2]]); else play([[880,.12,"square",0,.2],[1320,.5,"square",.1,.22]]);
  }, k*900));
  later(()=>{
    el.remove(); ui.counting=false;
    const tgt = G.phase==="tieBuzz" ? G.tie : G.round;
    if(tgt){ tgt.ready=true; ui.enterKey=null; save(); render(); }
  }, steps.length*900+150);
}
function nextRound(){
  stopConfetti();
  G.roundIdx++;
  if(G.roundIdx<RONDAS){ startRound(); return; }
  const [a,b]=G.teams;
  if(a.score===b.score){ startTie(); } else { G.winner=a.score>b.score?0:1; G.phase="final"; }
}
function startTie(note){
  G.tie={qi:pickUnused(), first:null, answering:null, cells:[0,0,0,0,0], fails:0, note:note||"", winAns:null, ready:false};
  G.phase="tieBuzz";
}
function parseList(s){ return String(s).split(/\r?\n/).map(x=>x.trim().replace(/\s+/g," ")).filter(Boolean); }

/* ---------- captura de respuestas ---------- */
function submitAnswer(){
  const inp=$("ans"); if(!inp) return;
  const text=inp.value.trim();
  if(!text){ ui.msg={k:"warn",t:"Escribe lo que dijo el alumno, o usa «Marcar ✖»."}; render(); return; }
  ui.pending=text;
  if(G.phase==="play"){
    const r=G.round, i=matchAnswer(text,Q(r.qi));
    if(i<0){ ui.msg={k:"nomatch",t:"Sin coincidencia"}; render(true); return; }
    if(r.cells[i]){ ui.msg={k:"warn",t:"Ya salió, intenta otra"}; ui.pending=""; render(); return; }
    act(()=>revealPlay(i));
    if(G.phase==="play"){ ui.msg={k:"ok",t:`¡Está en el tablero! +${Q(G.round.qi).r[i][1]}`}; const m=document.querySelector(".entry .msg"); if(m){ m.className="msg ok"; m.textContent="✔ "+ui.msg.t; } }
  } else if(G.phase==="steal"){
    const r=G.round, i=matchAnswer(text,Q(r.qi));
    if(i<0){ ui.msg={k:"stealno",t:"Sin coincidencia"}; render(true); return; }
    if(r.cells[i]){ ui.msg={k:"stealdup",t:"Esa respuesta ya salió. ¿Cuenta como robo fallido?"}; render(true); return; }
    act(()=>{ const q=Q(r.qi); r.cells[i]=2; r.bank+=q.r[i][1]; SFX.ok(); ui.flip=[i]; ui.fly={i,pts:q.r[i][1]}; endRound(other(r.control),"steal"); });
  } else if(G.phase==="tiePlay"){
    const t=G.tie, i=matchAnswer(text,Q(t.qi));
    if(i<0){ ui.msg={k:"nomatch",t:"Sin coincidencia"}; render(true); return; }
    act(()=>{ t.cells[i]=1; t.winAns=i; SFX.ok(); G.teams[t.answering].score+=Q(t.qi).r[i][1]; G.winner=t.answering; G.phase="tieWon";
      ui.flip=[i]; later(()=>{ SFX.win(); confetti(TEAMCOL[t.answering]); },500); });
  }
}
function strikeNow(){
  if(G.phase==="play") act(addStrike);
  else if(G.phase==="steal") act(()=>{ SFX.bad(); bigX(1); endRound(G.round.control,"stealFail"); });
  else if(G.phase==="tiePlay") act(()=>{
    const t=G.tie; SFX.bad(); bigX(1); t.fails++; ui.newX=t.fails;
    if(t.fails===1){ t.answering=other(t.first); }
    else { G.phase="tieFail"; }
  });
}

  Object.entries(map).forEach(([k,v])=>st.setProperty(v,c[k]));

  return playing && G.tema ? temaById(G.tema) : MEZCLA;
}

function render(keepText){
  const ph=G.phase, app=$("app");
  if(ph!=="final") ui.finalFx=false;
  applyTheme(currentTheme());
  let h=topBar();
  if(ph==="setup") h+=setupView();
  else if(ph==="review") h+=reviewView();
  else if(ph==="topics") h+=topicsView();
  else if(ph==="final") h+=finalView();
  else h+=gameView();
  app.innerHTML=h;
  bind();
  afterRender();
  ui.newX=0;
  const inp=$("ans");
  if(inp){ if(keepText||ui.msg&&["nomatch","stealno","stealdup"].includes(ui.msg.k)) inp.value=ui.pending; inp.focus(); if(keepText) inp.select(); }
}

/* Lee un tema nuevo desde un archivo .json (mismo formato que los temas de arriba) */
function loadTemaFile(file){
  const rd=new FileReader();
  rd.onload=()=>{
    try{
      const t=JSON.parse(rd.result);
      const err=validTema(t); if(err){ toast("No se pudo cargar: "+err); return; }
      t.id=String(t.id||t.nombre).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g,"-");
      const ya=TEMAS.find(x=>x.id===t.id);
      if(ya || t.id==="mezcla"){ toast(`El tema «${ya?ya.nombre:t.nombre}» ya viene incluido en el juego. Cambia su "id" para cargarlo como tema nuevo.`); return; }
      let extra=[]; try{ extra=JSON.parse(localStorage.getItem(EXTRA_KEY))||[]; }catch(e){}
      const reemplaza=extra.some(x=>x.id===t.id);
      extra=extra.filter(x=>x.id!==t.id); extra.push(t);
      try{ localStorage.setItem(EXTRA_KEY, JSON.stringify(extra)); }
      catch(e){ toast("No se pudo guardar el tema: el navegador no tiene espacio o bloquea el guardado"); return; }
      buildTemas(); render(); toast(`Tema «${t.nombre}» ${reemplaza?"actualizado":"cargado"} con ${t.preguntas.length} preguntas`);
    }catch(e){ toast("No se pudo cargar: el archivo no es un .json válido"); }
  };
  rd.readAsText(file);
}
function validTema(t){
  if(!t || typeof t!=="object") return "el archivo está vacío";
  if(!t.nombre) return "falta el nombre del tema";
  if(!Array.isArray(t.preguntas) || t.preguntas.length<RONDAS+1) return `se necesitan al menos ${RONDAS+1} preguntas (${RONDAS} rondas y 1 de desempate)`;
  for(let i=0;i<t.preguntas.length;i++){ const q=t.preguntas[i];
    if(!q || !q.p || !Array.isArray(q.r) || q.r.length!==5) return `la pregunta ${i+1} debe tener texto y 5 respuestas`;
    if(q.r.some(a=>!Array.isArray(a) || !a[0] || typeof a[1]!=="number")) return `revisa las respuestas de la pregunta ${i+1}`;
  }
  return "";
}
function quitarTema(id){
  let extra=[]; try{ extra=JSON.parse(localStorage.getItem(EXTRA_KEY))||[]; }catch(e){}
  localStorage.setItem(EXTRA_KEY, JSON.stringify(extra.filter(x=>x.id!==id)));
  buildTemas(); render(); toast("Tema quitado");
}

function gameView(){
  const ph=G.phase;
  const key = ph.startsWith("tie") ? "t"+G.tie.qi : "r"+G.roundIdx+"-"+G.round.qi;
  ui.enter = ui.enterKey!==key; ui.enterKey=key;
  if(ph.startsWith("tie")) return tieView();
  const r=G.round, q=Q(r.qi);
  const active = ph==="steal"?other(r.control):ph==="roundEnd"?r.winner:(r.control??-1);
  let side="";
  if(ph==="buzz"){
    side = r.ready===false ? goBox("Un integrante de cada equipo al frente, con las manos abajo.")
      : `<div class="box buzz"><h2 class="ttl display">¿Quién levantó la mano primero?</h2>
      <button class="big t0 display" data-buzz="0"><span class="ham">✋</span> ${esc(G.teams[0].name)}</button>
      <button class="big t1 display" data-buzz="1"><span class="ham">✋</span> ${esc(G.teams[1].name)}</button>
      <p class="hint">Levantar la mano primero da el control del tablero. Vale 0 puntos.</p></div>`;
  } else if(ph==="play"){
    const tm=G.teams[r.control];
    side=`<div class="chars">${r.chars.map((mi,k)=>`<div class="ch ${k===r.turn?"on":""}">
        <span class="k">Personaje ${k+1}</span><span class="nm display">${esc(tm.members[mi])}</span><span class="d">${ROLES[k]}</span></div>`).join("")}</div>
      ${strikesHTML(r.strikes)}
      ${entryHTML(`Respuesta del estudiante · ${esc(tm.members[r.chars[r.turn]])}`,
        `<div class="msgbtns"><button class="btn red" id="bX">Marcar ✖ (no respondió o falló)</button></div>`)}`;
  } else if(ph==="steal"){
    const rv=other(r.control);
    side=`<div class="steal t${rv} display">🚨 ¡Oportunidad de robo para ${esc(G.teams[rv].name)}!<small>Consulten entre ustedes y den UNA respuesta final.</small></div>
      ${strikesHTML(3)}
      ${entryHTML(`Respuesta final de ${esc(G.teams[rv].name)}`,
        `<div class="msgbtns"><button class="btn red" id="bX">Marcar robo fallido ✖</button></div>`)}`;
  } else if(ph==="roundEnd"){
    const w=r.winner, wn=esc(G.teams[w].name), cn=esc(G.teams[r.control].name);
    const how = r.how==="board" ? `${cn} descubrió todo el tablero.`
      : r.how==="steal" ? `¡Robo exitoso! ${wn} se lleva los puntos revelados.`
      : `Robo fallido: la bolsa se queda con ${cn}.`;
    side=`<div class="box result">
        <div class="w t${w} display">🏆 ${wn} gana la bolsa</div>
        <div class="plus num">+${r.gained}</div>
        <p class="how">${how}</p>
        <div class="legend"><span><i style="background:var(--gold)"></i>Descubiertas</span>${r.how==="steal"?`<span><i style="background:var(--teal)"></i>Robo</span>`:""}<span><i style="background:var(--miss)"></i>Nadie la dijo (no suma)</span></div>
      </div>
      ${revealAllBtn(r.cells)}
      <button class="btn wide display" id="bNext" style="font-size:clamp(18px,1.8vw,36px);padding:1.5vh 1vw">${G.roundIdx+1<RONDAS?"Siguiente ronda ▶":"Ver resultado final ▶"}</button>`;
  }
  return `${scoresHTML(active)}
    ${qBox(`Ronda ${G.roundIdx+1} · ${temaLabel()} · 100 estudiantes dijeron…`, q.p, r.ready===false)}
    <div class="main">${boardHTML(r.qi,r.cells,ph==="roundEnd")}<aside class="side c${active}">${side}</aside></div>`;
}
function tieView(){
  const t=G.tie, q=Q(t.qi), ph=G.phase;
  let side="";
  if(ph==="tieBuzz"){
    side=`${t.note?`<p class="msg warn">⚠ ${esc(t.note)}</p>`:""}
      ${t.ready===false ? goBox("¡Empate! Un integrante de cada equipo al frente, con las manos abajo.")
      : `<div class="box buzz"><h2 class="ttl display">¡Empate! ¿Quién levantó la mano primero?</h2>
      <button class="big t0 display" data-buzz="0"><span class="ham">✋</span> ${esc(G.teams[0].name)}</button>
      <button class="big t1 display" data-buzz="1"><span class="ham">✋</span> ${esc(G.teams[1].name)}</button>
      <p class="hint">Quien acierte una respuesta del tablero gana el concurso.</p></div>`}`;
  } else if(ph==="tiePlay"){
    side=`<div class="steal t${t.answering} display">Responde ${esc(G.teams[t.answering].name)}<small>${t.fails?"El otro equipo falló. ¡Una respuesta para ganar!":"Una respuesta del tablero para ganar."}</small></div>
      ${strikesHTML(t.fails)}
      ${entryHTML(`Respuesta de ${esc(G.teams[t.answering].name)}`,
        `<div class="msgbtns"><button class="btn red" id="bX">Marcar ✖</button></div>`)}`;
  } else if(ph==="tieFail"){
    side=`<div class="box result"><div class="w display" style="color:var(--gold)">Ninguno acertó</div>
        <p class="how">Revela las respuestas si quieres y luego pasa a otra pregunta.</p></div>
      ${strikesHTML(2)}
      ${revealAllBtn(t.cells)}
      <button class="btn wide display" id="bTieNext" style="font-size:clamp(18px,1.8vw,36px);padding:1.5vh 1vw">Nueva pregunta de desempate ▶</button>`;
  } else if(ph==="tieWon"){
    const w=t.answering;
    side=`<div class="box result"><div class="w t${w} display">🏆 ${esc(G.teams[w].name)} gana el desempate</div>
        <div class="plus num">+${q.r[t.winAns][1]}</div>
        <p class="how">Acertó con «${esc(q.r[t.winAns][0])}».</p></div>
      ${revealAllBtn(t.cells)}
      <button class="btn wide display" id="bFinal" style="font-size:clamp(18px,1.8vw,36px);padding:1.5vh 1vw">Ver resultado final ▶</button>`;
  }
  const act_ = ph==="tiePlay"?t.answering: ph==="tieWon"?t.answering:-1;
  return `${scoresHTML(act_)}
    ${qBox(`Pregunta de desempate · ${temaLabel()}`, q.p, ph==="tieBuzz" && t.ready===false)}
    <div class="main">${boardHTML(t.qi,t.cells,ph==="tieFail"||ph==="tieWon")}<aside class="side c${act_}">${side}</aside></div>`;
}
function finalView(){
  const T=G.teams, w=G.winner;
  const tie = G.tie && G.tie.winAns!=null;
  if(!ui.finalFx){ ui.finalFx=true; later(()=>{ confetti(TEAMCOL[w].concat(["#ff2e88","#18d3c2","#9be22d"]),220,true); },300); }
  return `<div class="final">
    <h1 class="display">¡Tenemos ganador!</h1>
    <div class="wn t${w} display">🏆 ${esc(T[w].name)}</div>
    ${tie?`<p class="how" style="font-size:clamp(14px,1.4vw,28px);font-weight:800;margin:0">Ganó el desempate con «${esc(Q(G.tie.qi).r[G.tie.winAns][0])}».</p>`:""}
    <div class="sc display"><span style="color:#9cc4ff">${esc(T[0].name)}: <b class="num" id="pts0">${T[0].score}</b></span><span style="color:#ffc08a">${esc(T[1].name)}: <b class="num" id="pts1">${T[1].score}</b></span></div>
    <button class="btn" id="bNew2" style="font-size:clamp(16px,1.5vw,30px);padding:1.4vh 2vw">⟲ Nueva partida</button>
  </div>`;
}

/* ---------- eventos ---------- */
function bind(){
  const on=(id,ev,fn)=>{ const el=$(id); if(el) el.addEventListener(ev,fn); };
  on("bSound","click",()=>{ G.sound=!G.sound; save(); render(); if(G.sound) SFX.ok(); });
  on("bFull","click",toggleFull);
  on("bUndo","click",undo);
  on("bNew","click",confirmNew); on("bNew2","click",confirmNew);
  // registro
  [0,1].forEach(t=>{
    on("tn"+t,"input",e=>{ G.draft[t].name=e.target.value; save(); });
    on("tl"+t,"input",e=>{ G.draft[t].list=e.target.value; const n=parseList(e.target.value).length; $("cnt"+t).textContent=`${n} integrante${n===1?"":"s"}`; save(); });
  });
  on("bReg","click",()=>{
    let ok=true;
    [0,1].forEach(t=>{ const n=parseList(G.draft[t].list).length, e=$("err"+t);
      if(n<3){ ok=false; e.textContent=`Faltan integrantes: se necesitan al menos 3 (hay ${n}).`; e.classList.remove("hidden"); }
      else e.classList.add("hidden"); });
    if(ok){ G.phase="review"; save(); render(); }
  });
  on("bBack","click",()=>{ G.phase="setup"; save(); render(); });
  on("bTopics","click",()=>{ G.phase="topics"; save(); render(); });
  on("bBack2","click",()=>{ G.phase="review"; save(); render(); });
  document.querySelectorAll(".tema[data-tema]").forEach(c=>{
    c.addEventListener("click",()=>{ UNDO=[]; startGame(c.dataset.tema); save(); render(); });
    c.addEventListener("mouseenter",()=>applyTheme(temaById(c.dataset.tema)));
    c.addEventListener("focus",()=>applyTheme(temaById(c.dataset.tema)));
  });
  document.querySelectorAll("[data-quitar]").forEach(x=>{
    x.addEventListener("click",()=>{ const t=temaById(x.dataset.quitar);
      if(confirm(`¿Quitar el tema «${t.nombre}» de esta computadora?`)) quitarTema(x.dataset.quitar); });
  });
  on("bLoad","click",()=>$("fileTema").click());
  on("bMenu","click",goMenu);
  on("bResume","click",resumeGame);
  on("bNew3","click",confirmNew);
  // juego
  document.querySelectorAll("[data-buzz]").forEach(b=>b.addEventListener("click",()=>{
    const t=+b.dataset.buzz;
    if(G.phase==="buzz") act(()=>pickBuzz(t));
    else if(G.phase==="tieBuzz") act(()=>{ G.tie.first=t; G.tie.answering=t; G.tie.note=""; G.phase="tiePlay"; SFX.buzz(); });
  }));
  on("ans","keydown",e=>{ if(e.key==="Enter"){ e.preventDefault(); submitAnswer(); } });
  on("ans","input",()=>{ if(ui.msg && ui.msg.k!=="ok"){ ui.msg=null; const m=document.querySelector(".entry .msg"); if(m){ m.textContent=""; m.className="msg"; } document.querySelectorAll(".entry .msgbtns").forEach((x,i,all)=>{ if(all.length>1 && i===0) x.remove(); }); } });
  on("bSend","click",submitAnswer);
  on("bX","click",strikeNow);
  on("bX2","click",strikeNow);
  on("bFix","click",()=>{ const i=$("ans"); i.focus(); i.select(); });
  on("bNext","click",()=>act(nextRound));
  on("bGo","click",countdown);
  on("bTieNext","click",()=>act(()=>startTie("Ninguno acertó: nueva pregunta de desempate.")));
  on("bFinal","click",()=>act(()=>{ G.phase="final"; }));
  // revelar respuestas que nadie dijo
  const cellsNow = ()=> G.phase.startsWith("tie") ? G.tie.cells : G.round.cells;
  document.querySelectorAll(".cell.can").forEach(c=>{
    const go=()=>act(()=>revealMissing(cellsNow(), +c.dataset.i));
    c.addEventListener("click",go);
    c.addEventListener("keydown",e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); go(); } });
  });
  on("bRevAll","click",()=>act(()=>{ const cs=cellsNow(); cs.forEach((v,i)=>{ if(!v){ cs[i]=3; ui.flip.push(i); } }); SFX.reveal(); }));
}
function toggleFull(){
  const d=document;
  if(!d.fullscreenElement){ (d.documentElement.requestFullscreen||d.documentElement.webkitRequestFullscreen||(()=>{})).call(d.documentElement); }
  else (d.exitFullscreen||d.webkitExitFullscreen).call(d);
}
function confirmNew(){
  const bg=document.createElement("div"); bg.className="modal-bg";
  bg.innerHTML=`<div class="modal"><h3 class="display">¿Empezar una nueva partida?</h3>
    <p>Se borrará el marcador actual. Los nombres de los equipos se conservan para que puedas corregirlos.</p>
    <div class="actions"><button class="btn ghost" id="mNo">Cancelar</button><button class="btn red" id="mYes">Sí, nueva partida</button></div></div>`;
  document.body.appendChild(bg); $("mNo").focus();
  $("mNo").onclick=()=>bg.remove();
  $("mYes").onclick=()=>{ bg.remove(); stopConfetti(); const d=G.draft, s=G.sound; G=fresh(); G.draft=d; G.sound=s; UNDO=[]; ui.msg=null; ui.shown=null; save(); render(); };
}
function bigX(n){
  const fx=$("fx"); fx.innerHTML=`<div id="bigX">${"<span>✖</span>".repeat(Math.max(1,Math.min(3,n)))}</div>`;
  clearTimeout(ui.fxX); ui.fxX=setTimeout(()=>fx.innerHTML="",1050);
  const app=$("app"); app.classList.remove("shake"); void app.offsetWidth; if(!REDUCED) app.classList.add("shake");
}
function toast(t){
  document.querySelectorAll(".toast").forEach(x=>x.remove());
  const el=document.createElement("div"); el.className="toast"; el.textContent=t; document.body.appendChild(el);
  setTimeout(()=>{ el.style.opacity=0; setTimeout(()=>el.remove(),450); },1800);
}

/* ---------- inicio ---------- */
(function init(){
  ALL_TEMAS.forEach(t=>t.preguntas.forEach((q,i)=>{ const s=q.r.reduce((a,x)=>a+x[1],0); if(q.r.length!==5||s!==100) console.warn(`${t.nombre}, pregunta ${i+1}: ${q.r.length} respuestas, suman ${s}`); }));
  $("fileTema").addEventListener("change",e=>{ const f=e.target.files[0]; if(f) loadTemaFile(f); e.target.value=""; });
  const had=load();
  render();
  if(had && !["setup","review"].includes(G.phase)) toast("Partida recuperada");
  addEventListener("resize",()=>{ const c=$("confetti"); c.width=innerWidth; c.height=innerHeight; });
})();
</script>
</body>
